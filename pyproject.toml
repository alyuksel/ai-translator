[tool.poetry]
name = "ai-translator-backend"
version = "0.1.0"
description = "Backend for the AI-powered translation application."
authors = ["AI Translator Team <dev@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.111.0"
uvicorn = {version = "0.29.0", extras = ["standard"]}
pydantic = "1.10.15"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.2"

[tool.pytest.ini_options]
pythonpath = ["backend"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
